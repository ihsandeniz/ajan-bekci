[package]
name = "ajan-bekci-cekirdek"
version = "0.1.0"
edition = "2024"
description = "Process-tree cage and leftover scanner behind ajan-bekci."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ihsandeniz/ajan-bekci"
publish = false

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }
signal-hook = "0.4.5"

# Job Object (KILL_ON_JOB_CLOSE), süreç/iş parçacığı tanıtıcıları, konsol olayları, Toolhelp
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
